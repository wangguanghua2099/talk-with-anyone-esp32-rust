[package]
name = "talk-with-anyone-esp32"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# unstable：I2S DMA 流式缓冲（dma_*_stream_buffer!）等 API 需要
# 注意：esp 系列全部用 .deps/esp-hal 的本地克隆（tag esp-hal-v1.2.0，commit dbd951f），
# 因为 crates.io 上 esp-radio 没有配 esp-hal 1.2 的发布版；同系列必须同源，
# 否则 links/类型冲突（esp-rom-sys、xtensa-lx-rt 等都带 links 键）。
esp-hal = { path = ".deps/esp-hal/esp-hal", features = ["esp32s3", "unstable"] }
esp-radio = { path = ".deps/esp-hal/esp-radio", features = ["esp32s3", "wifi"] }
esp-rtos = { path = ".deps/esp-hal/esp-rtos", features = ["esp32s3", "esp-radio", "embassy"] }
esp-alloc = { path = ".deps/esp-hal/esp-alloc", features = ["esp32s3"] }
esp-println = { path = ".deps/esp-hal/esp-println", features = ["esp32s3"] }
esp-bootloader-esp-idf = { path = ".deps/esp-hal/esp-bootloader-esp-idf", features = ["esp32s3"] }
esp-backtrace = { path = ".deps/esp-hal/esp-backtrace", features = ["esp32s3", "panic-handler", "println"] }
embassy-executor = "0.10.0"
embassy-futures = "0.1.1"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns", "udp"] }
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
# wss（TLS 1.3）客户端：纯 Rust no_std 实现，用本仓库 .deps/embedded-tls
# （自 crates.io 0.19.0 复制并打了"取消安全"补丁；本固件在 select(next_frame, 50ms)
# 里调用 TLS 读写，必须取消安全——动机、改动清单与升级指引见其 PATCH-NOTES.md）。
# default-features = false：不做证书校验（与 C++ 版 beginSSL(..., nullptr, nullptr) 同策略），
# 不需要 webpki/rustpki/rsa/std 等特性；RSA 由运行时 enable_rsa_signatures() 通告。
embedded-tls = { path = ".deps/embedded-tls", default-features = false }
# embedded-tls 握手需要 rand_core 0.6 的 RngCore/CryptoRng 取随机数；
# esp-hal 的 `unstable` 特性已为 Rng 实现同版本 RngCore，ws.rs 里补一个 CryptoRng 适配器。
rand_core = "0.6"
# WS 客户端：从本工程提炼的独立 crate（取消安全帧状态机 + 升级握手 + SHA-1/accept
# 校验；见 ../embedded-ws）。本工程只保留 ws.rs 适配层（Transport 枚举 / TrngRng /
# 静态缓冲收回）。wss 的 TLS 记录层仍用上面的 .deps/embedded-tls。
embedded-ws = { path = "../embedded-ws" }
# embedded-ws 的 Transport 契约要在实现侧命名这些 traits
# （与 embassy-net / embedded-tls / embedded-ws 同一 0.7 线）。
embedded-io-async = "0.7"
# u8g2 / LovyanGFX 点阵字库：解码器 + 捆绑数据（原 src/font.rs 抽成的 crate 家族）。
# default-features = false：关掉 `gen`（C 字面量解析 + blob 抽取，会拉进 alloc），
# 设备侧不引入 alloc。efont-cn-14 特性经主 crate 0.2 的 fonts 模块桥接独立的纯数据包
# lovyangfx-fonts-efont-cn（blob 与 LovyanGFX 上游数组逐字节一致，上游声明随包分发），
# 本仓库不再自带 blob。
lovyangfx-fonts = { version = "0.2", default-features = false, features = ["efont-cn-14"] }
static_cell = "2"
heapless = "0.9"
libm = "0.2"

[profile.release]
opt-level = "s"
lto = true
